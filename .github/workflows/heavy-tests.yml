name: Heavy tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: heavy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-heavy-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Build packages
        run: bun run build:packages

      - name: Heavy fixture unit tests
        shell: bash
        run: |
          mapfile -t test_files < <(bun tools/unit-tests/src/list.ts all --heavy-only)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No heavy unit tests found"
            exit 0
          fi
          bun test --timeout 180000 "${test_files[@]}"
        env:
          BUN_HEAVY_TESTS: 'true'

  isolated-unit-tests:
    name: Isolated unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'
          lfs-include: tests/fixtures/gold-preview.fig,tests/fixtures/circle-text.fig,tests/fixtures/fonts/*

      - name: Build shared Core test dependency
        run: bun --filter @open-pencil/core build

      # Every file gets a fresh global object, so a suite that only passes
      # because an earlier file initialized a codec, loaded a font or left a
      # database open fails here instead of flaking in a PR shard.
      - name: Quick unit tests with per-file isolation
        run: bun run test:unit:isolated
        env:
          BUN_HEAVY_TESTS: 'false'
